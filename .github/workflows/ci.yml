name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --ci
      - name: Run browser and online verification
        shell: bash
        run: |
          set -euo pipefail

          server_log="${RUNNER_TEMP}/overlimit-server.log"
          PORT=3002 node server.js > "$server_log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3002/healthz > /dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "Local verification server failed to become ready."
            cat "$server_log"
            exit 1
          fi

          npm run verify:skill-fx
          npm run verify:ui
          npm run verify:interactions
          npm run verify:online
          npm run verify:i18n
      - run: node scripts/simulate-chip-economy.js 80
      - run: node scripts/simulate-overdrive.js 100
